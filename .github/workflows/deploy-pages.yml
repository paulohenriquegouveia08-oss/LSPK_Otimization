name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/lspk-optimizer-site/package-lock.json

      - name: Install dependencies
        working-directory: web/lspk-optimizer-site
        run: npm ci

      - name: Build Web Landing Page
        working-directory: web/lspk-optimizer-site
        run: npm run build

      - name: Copy static update manifest and download placeholder
        run: |
          mkdir -p web/lspk-optimizer-site/dist/download
          mkdir -p web/lspk-optimizer-site/dist/updates
          cp server/optimizer/download/LSPKOptimizerSetup.exe web/lspk-optimizer-site/dist/download/ || touch web/lspk-optimizer-site/dist/download/LSPKOptimizerSetup.exe
          cp server/optimizer/updates/latest.json web/lspk-optimizer-site/dist/updates/latest.json
          touch web/lspk-optimizer-site/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/lspk-optimizer-site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
